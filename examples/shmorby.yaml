# ── Provider ────────────────────
# Choose one: ollama | openai | openrouter | opencode_zen
# Default: ollama (no API key needed for local LLM)
provider: ollama

# ── Model ───────────────────────
model: llama3.2

# ── Agent ───────────────────────
agent:
  default: operate          # operate | diagnose
  max_tool_iterations: 25
  shell: bash

# ── Provider-specific options ──
ollama:
  base_url: http://127.0.0.1:11434

openai:
  api_key: ""
  api_key_env: ""           # optional: read key from env var
  base_url: ""
  organization: ""
  timeout: 120

openrouter:
  api_key: ""

opencode_zen:
  api_key: ""
  base_url: ""

# ── Scope ──────────────────────
scope:
  # On Windows, use e.g.: workdir: C:/Users/admin/infra (use forward slashes)
  workdir: /home/user/shmorby               
  instructions:
    - ./SCOPE.md
    - ./runbooks/*.md

# ── Tools ──────────────────────
tools:
  timeout: 1800
  shell:
    enabled: true
  sudo:
    enabled: false
  aws:
    enabled: false

# ── Websearch ──────────────────
# Both tools disabled by default. Available in all agent modes when enabled.
# websearch:
#   enabled: false                    # Enable web search
#   engine: searxng                   # "searxng" (local, no CAPTCHAs) or "exa" (cloud)
#   base_url: http://localhost:8888   # SearXNG instance URL (required for searxng)
#                                     # SearXNG must have JSON format enabled in settings.yml:
#                                     #   search:
#                                     #     formats:
#                                     #       - html
#                                     #       - json
#   # exa_api_key: "sk-exa-..."      # Required for exa engine (get from exa.ai)
#
# webfetch:
#   enabled: false                    # Enable URL fetching
#                                     # SSRF protection: blocks private/loopback IPs
#                                     # Max 64 KiB default, 1 MiB absolute max

# ── Permission ─────────────────
permission:
  shell: ask
  ssh: ask
  sudo: ask
  aws: ask
  mcp: ask
  interactive: true
  presets: []
  rules: []

# ── Model overrides ────────────
models: {}

# ── TUI ────────────────────────
tui:
  fullscreen: false
  theme: catppuccin-mocha
  glamour:
    enabled: true
  # Status descriptions for the spinner.
  # Generates meaningful labels from tool name and command (no LLM needed).
  # Examples: "running df -h", "ssh: uptime", "searching: golang concurrency"
  # Set to "off" to disable.
  # status_model: "off"  # disable status descriptions
  nav:
    follow_mode: true
    scroll_lines_per_tick: 5
    leader_timeout: 2000
    history_size: 100
    keybinds:
      leader: ctrl+x
      agent_cycle: tab
      agent_cycle_reverse: shift+tab
      command_list: ctrl+p
      history_search: ctrl+r
      session_new: '<leader>n'
      session_list: '<leader>l'
      session_compact: '<leader>c'
      model_list: '<leader>m'
      theme_list: '<leader>t'
      agent_list: '<leader>a'
      session_undo: '<leader>u'
      session_redo: '<leader>r'
      editor_open: '<leader>e'
      session_export: '<leader>x'
      app_exit: '<leader>q'
      status_view: '<leader>s'
      sidebar_toggle: '<leader>b'
      tips_toggle: '<leader>h'
      messages_copy: '<leader>y'
      session_child_first: '<leader>down'
      session_parent: up
      session_child_cycle: right
      session_child_cycle_reverse: left
    scroll_acceleration:
      enabled: false
    references: []
  logging:
    enabled: true
    default_level: info
    max_entries: 100
    display_limit: 20
    collapse: true
    collapse_threshold: 5

# ── Memory ─────────────────────
memory:
  enabled: true
  # On Windows, use e.g.: db_path: C:/Users/you/.local/share/shmorby/memory.db
  db_path: ~/.local/share/shmorby/memory.db 
  max_entries: 10000
  auto_capture: true
  embedding:
    provider: ollama
    model: nomic-embed-text
    base_url: ""

# ── MCP servers ────────────────
# mcp:
#   servers:
#     db:
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-postgres", "postgresql://..."]
#     k8s:
#       command: docker
#       args: ["run", "-i", "--rm", "mcp/k8s"]
#       env:
#         - "KUBECONFIG=/home/user/.kube/config"

# ── Context compression ────────
# Message ordering is optimized for OpenAI automatic prefix
# caching — no config needed.
context:
  enabled: true
  mode: auto                   # auto | aggressive | conservative | off
  threshold: 0.8
  max_tool_output_tokens: 4096
  max_tool_output_lines: 0     # 0 = unlimited
  max_tool_output_bytes: 0     # 0 = unlimited
  summary_model: ""
  summary_provider: ""
  offload_to_memory: true
  min_messages_to_compress: 6
  fallback_context_window: 128000

# ── Audit ──────────────────────
audit:
  enabled: true
  db_path: ~/.local/share/shmorby/audit.db
  output_capture_max_bytes: 65536
  retention_days: 365
  async_buffer_size: 100

# ── Provider ────────────────────
# Choose one: ollama | openai | openrouter | opencode_zen
# Default: ollama (no API key needed for local LLM)
provider: ollama

# ── Model ───────────────────────
model: llama3.2

# ── Agent ───────────────────────
agent:
  default: operate          # operate | diagnose | chat | code
  max_tool_iterations: 25
  shell: bash

# ── Provider-specific options ──
ollama:
  base_url: http://127.0.0.1:11434

openai:
  api_key: ""
  api_key_env: ""           # optional: read key from env var
  base_url: ""
  organization: ""
  timeout: 120

openrouter:
  api_key: ""

opencode_zen:
  api_key: ""
  base_url: ""

# ── Scope ──────────────────────
scope:
  # On Windows, use e.g.: workdir: C:/Users/admin/infra (use forward slashes)
  workdir: /home/user/shmorby               
  instructions:
    - ./SCOPE.md
    - ./runbooks/*.md

# ── Tools ──────────────────────
# Exhaustive migrate backfill (issue #126) injects every
# `enabled=false` when absent, so the file stays explicit and
# `migrate --dry-run` is exhaustive. Empty api_key/models/presets
# stay omitted intentionally.
tools:
  timeout: 1800
  subtask_timeout: 0           # max seconds per subtask (0 = derived from timeout × max_tool_iterations × 2)
  shell:
    enabled: true
  sudo:
    enabled: false
  aws:
    enabled: false
  websearch:
    enabled: false                    # Enable web search
    engine: searxng                   # "searxng" (local, no CAPTCHAs) or "exa" (cloud)
    base_url: http://localhost:8888   # SearXNG instance URL (required for searxng)
                                      # SearXNG must have JSON format enabled in settings.yml:
                                      #   search:
                                      #     formats:
                                      #       - html
                                      #       - json
    # exa_api_key: "sk-exa-..."      # Required for exa engine (get from exa.ai)
  webfetch:
    enabled: false                    # Enable URL fetching
                                      # SSRF protection: blocks private/loopback IPs
                                      # Max 64 KiB default, 1 MiB absolute max

# ── Permission ─────────────────
permission:
  shell: ask
  ssh: ask
  sudo: ask
  aws: ask
  mcp: ask
  find: allow                # code mode: search for files
  file_read: allow           # code mode: read file contents
  file_edit: ask             # code mode: edit file contents
  file_write: ask            # code mode: create/overwrite files
  grep: allow                # code mode: search file contents
  interactive: true
  presets: []
  rules: []

# ── Model overrides ────────────
models: {}

# ── Code mode ─────────────────
# Project root anchoring for file tools (file_read, file_edit,
# file_write, find, grep). Defaults to the launch CWD.
# File tools are confined to the root: paths outside it are rejected
# unless matched by allowed_patterns.
code:
  workdir: "."                   # project root; "." = launch CWD
  allowed_patterns: []           # globs permitted outside the root
  blocked_patterns:              # always rejected (override defaults):
    - "**/.git/**"
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/.idea/**"
    - "**/.vscode/**"

# ── TUI ────────────────────────
tui:
  fullscreen: false
  theme: catppuccin-mocha
  glamour:
    enabled: true
  # Status descriptions for the spinner.
  # Generates meaningful labels from tool name and command (no LLM needed).
  # Examples: "running df -h", "ssh: uptime", "searching: golang concurrency"
  # Set to "off" to disable.
  # status_model: "off"  # disable status descriptions
  nav:
    follow_mode: true
    scroll_lines_per_tick: 5
    leader_timeout: 2000
    history_size: 100
    keybinds:
      leader: ctrl+x
      agent_cycle: tab
      agent_cycle_reverse: shift+tab
      command_list: ctrl+p
      history_search: ctrl+r
      session_new: '<leader>n'
      session_list: '<leader>l'
      session_compact: '<leader>c'
      model_list: '<leader>m'
      theme_list: '<leader>t'
      agent_list: '<leader>a'
      session_undo: '<leader>u'
      session_redo: '<leader>r'
      editor_open: '<leader>e'
      session_export: '<leader>x'
      app_exit: '<leader>q'
      status_view: '<leader>s'
      sidebar_toggle: '<leader>b'
      tips_toggle: '<leader>h'
      messages_copy: '<leader>y'
      session_child_first: '<leader>down'
      session_parent: up
      session_child_cycle: right
      session_child_cycle_reverse: left
    scroll_acceleration:
      enabled: false
    references: []
  logging:
    enabled: true
    default_level: info
    max_entries: 100
    display_limit: 20
    collapse: true
    collapse_threshold: 5

# ── Memory ─────────────────────
memory:
  enabled: true
  # On Windows, use e.g.: db_path: C:/Users/you/.local/share/shmorby/memory.db
  db_path: ~/.local/share/shmorby/memory.db 
  max_entries: 10000
  auto_capture: true
  context_budget: 300      # cap injected memory tokens (0 = unlimited)
  embedding:
    provider: ollama
    model: nomic-embed-text
    base_url: ""
    dimensions: 0            # 0 = model default (768 for nomic-embed-text)
                              # Set to 64-256 for cheaper Matryoshka vectors.
                              # Changing dimensions on an existing store
                              # requires clearing the vector index
                              # (vectors/ dir), otherwise retrieval
                              # silently degrades.

# ── MCP servers ────────────────
# mcp:
#   servers:
#     db:
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-postgres", "postgresql://..."]
#     k8s:
#       command: docker
#       args: ["run", "-i", "--rm", "mcp/k8s"]
#       env:
#         - "KUBECONFIG=/home/user/.kube/config"
#     rovo:
#       # Remote streamable HTTP endpoint. Set exactly one of
#       # command or url per server.
#       url: https://mcp.atlassian.com/v1/mcp
#       headers:
#         # Header values support ${VAR} env substitution so secrets
#         # can stay out of the config file. Headers are never logged.
#         Authorization: "Basic ${ROVO_EMAIL_TOKEN}"

# ── Context compression ────────
# Message ordering is optimized for OpenAI automatic prefix
# caching — no config needed.
context:
  enabled: true
  mode: auto                   # auto | aggressive | conservative | off
  threshold: 0.8
  max_tool_output_tokens: 4096
  max_tool_output_lines: 0     # 0 = unlimited
  max_tool_output_bytes: 0     # 0 = unlimited
  summary_model: ""        # LLM model for summarization (empty = extractive)
  summary_provider: ""     # LLM provider for summarization (empty = use main)
  offload_to_memory: true
  min_messages_to_compress: 6
  fallback_context_window: 128000

# ── Audit ──────────────────────
audit:
  enabled: true
  db_path: ~/.local/share/shmorby/audit.db
  output_capture_max_bytes: 65536
  retention_days: 365
  async_buffer_size: 100

# ── Session persistence ────────
# Conversations are saved continuously (write-through) to a SQLite
# DB so they survive restarts and can be resumed with
# `shmorby -c` (most recent for the launch directory) or
# `shmorby -s <id>`. Sessions are scoped to their stored working
# directory; resuming from another directory chdirs back to it.
# All persisted content (message text, tool-call args, tool
# output) is run through secret redaction first, same policy as
# audit/memory — but sessions still contain redacted-but-otherwise
# raw operational history (hostnames, paths, command output).
# enabled is read at startup: changing it via /set requires restart.
session:
  enabled: true
  db_path: ~/.local/share/shmorby/sessions.db
  retention_days: 90      # prune age for archived+inactive sessions
  max_sessions: 200       # hard cap; oldest pruned first

# ── Ledger ─────────────────────
# Encrypted environment ledger for cross-session memory.
# When enabled, the agent exposes ledger_get/ledger_set tools and
# injects ledger context into the system prompt at session start.
# Secrets are redacted before storage (defense in depth).
# enabled is read at startup: changing it via /set requires restart.
ledger:
  enabled: true
  context_budget: 2048    # max bytes of ledger data injected into
                          # the system prompt (0 = unlimited)
